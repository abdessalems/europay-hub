spring:
  application:
    name: europay-hub

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/europay}
    username: ${DB_USERNAME:europay}
    password: ${DB_PASSWORD:europay}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

europay:
  version: 0.1.0-SNAPSHOT
  security:
    jwt:
      # Dev secret (min 32 bytes). Override in production via JWT_SECRET env var.
      secret: ${JWT_SECRET:change-me-in-production-europay-hub-dev-secret-key-0123456789}
      expiration-minutes: 60
      issuer: europay-hub
  # Business-rule configuration (enforced in later phases)
  payment:
    max-amount-minor: 1000000   # 10,000.00 EUR
    default-currency: EUR
    expiry-minutes: 15
  webhook:
    max-retries: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.europay.hub: INFO
